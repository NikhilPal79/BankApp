spring:
  application:
    name: BankingApp
  datasource:
    url: jdbc:postgresql://localhost:5432/Customers
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false





server:
  port: 8083





